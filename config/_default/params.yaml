# Blowfish params — SBORONE MODE 🐡💛🎆

# CUSTOM GOLD color scheme
colorScheme: "palladius"

enableSearch: true
enableCodeCopy: true

# Footer
footer:
  showCopyright: true
  showThemeAttribution: false
  showAppearanceSwitcher: true
  showScrollToTop: true

# Homepage — PROFILE layout (compact, no giant image)
homepage:
  layout: "profile"
  homepageImage: "images/hero-chi-sono.jpg"
  showRecent: true
  showRecentItems: 12
  showMoreLink: true
  showMoreLinkDest: "/posts"
  cardView: true
  cardViewScreenWidth: false
  layoutBackgroundBlur: true

# Author info in sidebar
author:
  name: "Riccardo Carlesso"
  image: "riccardo-bicicletta-gugol.jpg"
  headline: "20 anni di maialate 🐷"
  bio: |
    Opere, viaggi, foto, seghe mentali.
    🦄 Googler · 💎 Rubyist · 🍷 Half-Stack Developer
  links:
    - github: https://github.com/palladius
    - linkedin: https://linkedin.com/in/riccardocarlesso
    - youtube: https://www.youtube.com/c/riccardocarlesso

# Article display
article:
  showDate: true
  showViews: false
  showLikes: false
  showDateUpdated: false
  showAuthor: true
  showAuthorBottom: true
  showBreadcrumbs: true
  showDraftLabel: true
  showEdit: false
  showHeadingAnchors: true
  showPagination: true
  showReadingTime: true
  showTableOfContents: true
  showTaxonomies: true
  showWordCount: false
  showHero: true
  heroStyle: "background"
  sharingLinks:
    - linkedin
    - twitter
    - email

# List pages — CARD VIEW with images
list:
  showBreadcrumbs: true
  showTableOfContents: false
  showTaxonomies: true
  groupByYear: true
  cardView: true
  cardViewScreenWidth: false
  showHero: true
  heroStyle: "background"

# Taxonomy
taxonomy:
  showTermCount: true
  cardView: true

# Header
header:
  layout: "fixed"
  logo: "images/logo_palladius.png"
  showTitle: false

# Image processing
imageProcessing:
  cover:
    enabled: true
  content:
    enabled: true
