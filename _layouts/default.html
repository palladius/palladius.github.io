<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    <!-- Banner di Warning Intelligente per GitHub Pages -->
    <div id="gh-pages-catchall-banner" style="display: none; padding: 15px; text-align: center; z-index: 9999; font-family: sans-serif;"></div>
    <script>
      (function() {
        var hostname = window.location.hostname;
        var pathname = window.location.pathname;
        var banner = document.getElementById('gh-pages-catchall-banner');

        // Se l'utente visita questo sito tramite il dominio github.io invece del dominio principale
        if (hostname.indexOf('palladius.github.io') !== -1) {
          // Se siamo sulla root page esatta, non mostrare l'allarme
          if (pathname === '/' || pathname === '/index.html') {
            return;
          }
          
          banner.style.display = 'block';
          banner.style.background = '#ef4444'; // Rosso fuoco
          banner.style.color = '#ffffff';
          banner.style.fontWeight = 'bold';
          banner.innerHTML = '🚨 ATTENZIONE: Questo sito tende ad attrarre i GitHub Pages di altri siti di palladius! 🚨<br><small>Sei sul dominio <code>palladius.github.io</code>. Se cercavi un altro progetto, la sua build GitHub Pages è fallita. Se cercavi questo blog, visita il dominio corretto.</small>';
        }
      })();
    </script>
    <!-- Fine Banner -->

    {% include header.html %}

    <div class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </div>

    {% include footer.html %}

  </body>

</html>
